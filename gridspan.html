<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Grid Example</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            padding: 30px;
            background-color: #f5f5f5;
        }

        h1 {
            text-align: center;
        }

        /* GRID CONTAINER */
        .container {
            display: grid;

            grid-template-columns: 1fr 1fr 1fr;
            grid-template-rows: 120px 120px 120px;
            gap: 15px;

            border: 4px solid black;
            padding: 15px;

            background-color: lightgray;
        }

        /* GRID ITEMS */
        .box {
            border: 3px solid green;
            background-color: lightgreen;

            display: flex;
            justify-content: center;
            align-items: center;

            font-size: 24px;
            font-weight: bold;
        }

        /* SPAN EXAMPLES */

        /*
        Occupy 2 columns
        grid-column: span 2;

        Occupy 2 rows
        grid-row: span 2;

        Start at column line 1, end at line 3
        grid-column: 1 / 3;

        Start at row line 1, end at line 3
        grid-row: 1 / 3;

        Occupy the entire row
        grid-column: 1 / -1;
        */
        /* BOX 1 takes up 2 columns */
        .wide {
            grid-column: span 2;
        }

        /* BOX 4 takes up 2 rows */
        .tall {
            grid-row: span 2;
        }

    </style>
</head>

<body>

    <h1>GRID EXAMPLE</h1>

    <div class="container">

        <div class="box wide">BOX 1 (2 COLUMNS)</div>
        <div class="box">BOX 2</div>
        <div class="box">BOX 3</div>

        <div class="box tall">BOX 4 (2 ROWS)</div>
        <div class="box">BOX 5</div>
        <div class="box">BOX 6</div>

    </div>

</body>
</html>
